# Cloudflare Tunnel Configuration
# Place at ~/.cloudflared/config.yml or reference with --config

# Your tunnel UUID from `cloudflared tunnel create`
tunnel: <YOUR_TUNNEL_UUID>

# Path to credentials file generated by `cloudflared tunnel create`
credentials-file: /root/.cloudflared/<YOUR_TUNNEL_UUID>.json

# Metrics (optional, for monitoring)
metrics: 0.0.0.0:20241

# Ingress rules: map hostnames to local services
ingress:
  # Primary endpoint for the sandbox-router
  - hostname: bot-api.yourdomain.com
    service: http://localhost:8787
    originRequest:
      # If your local sandbox-router uses HTTP (common for Workers dev)
      noTLSVerify: true
      # Preserve the host header
      httpHostHeader: localhost

  # Optional: health check endpoint
  - hostname: bot-health.yourdomain.com
    service: http://localhost:20241

  # Catch-all: return 404 for unmatched hostnames
  - service: http_status:404
