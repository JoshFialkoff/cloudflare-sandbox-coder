# Cloudflare Tunnel Configuration for goose-bot-tunnel
# Installed at ~/.cloudflared/config.yml on the bot host.

tunnel: goose-bot-tunnel
credentials-file: /Users/dev/.cloudflared/527df988-67ad-46cb-903b-fbe80327aead.json

metrics: 0.0.0.0:20241
no-autoupdate: true

ingress:
  # Primary endpoint: fronts the deployed sandbox-router Worker
  - hostname: bot-api.assistedly.ai
    service: https://sandbox-router.forwardjump-com198.workers.dev

  # Catch-all: 404 for unmatched hostnames
  - service: http_status:404