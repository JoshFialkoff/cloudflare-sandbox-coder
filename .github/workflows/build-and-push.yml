# Build the sandbox-router container image, push it to GHCR for
# storage/versioning, then push the same image to the Cloudflare
# Registry and deploy the Worker.
#
# GHCR is NOT a supported image source for Cloudflare Containers
# (only Cloudflare Registry, Docker Hub, Amazon ECR, and Google
# Artifact Registry are).  The workflow therefore mirrors the image
# to the Cloudflare Registry and updates wrangler.jsonc to reference
# that registry — not GHCR directly.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  – Cloudflare API token with Workers/Containers permissions
#   CLOUDFLARE_ACCOUNT_ID – Your Cloudflare account ID
#
# The GITHUB_TOKEN is provided automatically and used to push to GHCR.

name: Build & Push Container Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-and-push.yml
  workflow_dispatch:

env:
  # GHCR image name (lowercase).  Uses the repo owner/name automatically.
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  # Cloudflare Registry image name.  Uses the account ID from secrets.
  CF_IMAGE: registry.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/sandbox-router
  IMAGE_TAG: latest

permissions:
  contents: write   # needed to commit the updated wrangler.jsonc
  packages: write    # needed to push to GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 1. Build & push to GHCR (storage / versioning) ──────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 2. Mirror the image to the Cloudflare Registry ─────────────
      # Cloudflare Containers can only pull from the Cloudflare Registry
      # (or Docker Hub / ECR / GAR), not from GHCR.  We re-tag the image
      # we just built and push it with `wrangler containers push`.
      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Tag image for Cloudflare Registry
        run: docker tag ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }} ${{ env.CF_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Push to Cloudflare Registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler containers push ${{ env.CF_IMAGE }}:${{ env.IMAGE_TAG }}

      # ── 3. Update wrangler.jsonc to reference the CF Registry image ─
      - name: Update wrangler.jsonc image reference
        run: |
          # Replace the containers[].image value with the CF Registry reference.
          # Works for both "image": "./Dockerfile" and any existing registry ref.
          python3 - <<'PY'
          import json, pathlib

          p = pathlib.Path("wrangler.jsonc")
          text = p.read_text()
          # Strip JSONC comments before parsing (simple line-comment removal).
          import re
          cleaned = re.sub(r'^\s*//.*$', '', text, flags=re.MULTILINE)
          cfg = json.loads(cleaned)

          cf_image = "${{ env.CF_IMAGE }}:${{ env.IMAGE_TAG }}"
          for c in cfg.get("containers", []):
              if "image" in c:
                  c["image"] = cf_image

          p.write_text(json.dumps(cfg, indent=2) + "\n")
          print(f"Updated wrangler.jsonc → image: {cf_image}")
          PY

      - name: Commit updated wrangler.jsonc
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc
          git commit -m "chore: reference Cloudflare Registry image for sandbox-router container" || echo "Nothing to commit"
          git push

      # ── 4. Deploy the Worker ────────────────────────────────────────
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
