# Build the sandbox-router container image, push it to GHCR for
# storage/versioning, then push the same image to the Cloudflare
# Registry and deploy the Worker.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  – Cloudflare API token with Workers/Containers permissions
#   CLOUDFLARE_ACCOUNT_ID – Your Cloudflare account ID

name: Build & Push Container Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-and-push.yml
  workflow_dispatch:

env:
  CF_IMAGE: registry.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/sandbox-router

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase GHCR image name
        id: ghcr
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set image tag (short SHA — Cloudflare disallows 'latest')
        id: tag
        run: echo "tag=$(echo '${{ github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          tags: |
            ${{ steps.ghcr.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ghcr.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Tag image for Cloudflare Registry
        run: docker tag ${{ steps.ghcr.outputs.image }}:${{ steps.tag.outputs.tag }} ${{ env.CF_IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Push to Cloudflare Registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler containers push ${{ env.CF_IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Update wrangler.jsonc image reference
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          p = pathlib.Path("wrangler.jsonc")
          text = p.read_text()
          cleaned = re.sub(r'^\s*//.*$', '', text, flags=re.MULTILINE)
          cfg = json.loads(cleaned)
          cf_image = "${{ env.CF_IMAGE }}:${{ steps.tag.outputs.tag }}"
          for c in cfg.get("containers", []):
              if "image" in c:
                  c["image"] = cf_image
          p.write_text(json.dumps(cfg, indent=2) + "\n")
          print(f"Updated wrangler.jsonc → image: {cf_image}")
          PY

      - name: Commit updated wrangler.jsonc
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc
          git commit -m "chore: reference Cloudflare Registry image for sandbox-router container" || echo "Nothing to commit"
          git push

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
